# ==============================================================================
# پیکربندی بهینه‌سازی‌شده Nginx برای سامانه و وب‌سرویس‌های آموت‌بار
# مسیر قرارگیری روی سرور: /etc/nginx/sites-available/amutbar
# فعال‌سازی: ln -s /etc/nginx/sites-available/amutbar /etc/nginx/sites-enabled/
# ==============================================================================

# تعریف محدودیت نرخ برای جلوگیری از سوءاستفاده از ارسال پیامک (OTP Rate Limiting)
limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name amut.speed-ping.shop;

    root /var/www/amutbar-admin;
    index index.php dashboard.php index.html;

    client_max_body_size 25M; # حداکثر حجم برای آپلود مدارک و ویدیوهای احراز هویت

    # هدرهای امنیتی استاندارد
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # فشرده‌سازی خروجی JSON و استاتیک برای افزایش سرعت
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript application/x-javascript text/xml application/xml;

    # ۱. هدایت درخواست‌های API به روتر /api/v1/index.php
    location /api/v1/ {
        try_files $uri $uri/ /api/v1/index.php?$query_string;
    }

    # ۲. اعمال محدودیت نرخ روی اندپوینت ارسال کد تایید OTP
    location = /api/v1/auth/request-otp {
        limit_req zone=otp_limit burst=2 nodelay;
        try_files $uri /api/v1/index.php?$query_string;
    }

    # ۳. مسیر Swagger UI
    location /swagger/ {
        try_files $uri $uri/ /swagger/index.php?$query_string;
    }

    # ۴. مسیر پیش‌فرض پنل و فایل‌های عمومی
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ۵. مسدودسازی دسترسی به دایرکتوری‌های حساس
    location ^~ /includes/ { deny all; return 404; }
    location ^~ /database/ { deny all; return 404; }
    location ^~ /tests/ { deny all; return 404; }
    location ^~ /.github/ { deny all; return 404; }

    # ۶. امنیت حیاتی: جلوگیری از اجرای هرگونه کد PHP داخل پوشه آپلودها
    location ~* ^/storage/uploads/.*\.php$ {
        deny all;
        return 404;
    }

    # ۷. بستن دسترسی به فایل‌های کانفیگ، لاگ، سورس و دیتابیس
    location ~* (\.env|\.git|\.sql|\.log|\.bak|\.backup|composer\.(json|lock)|package(-lock)?\.json)$ {
        deny all;
        return 404;
    }

    # ۸. پردازش فایل‌های PHP توسط PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # یا php8.1-fpm.sock بر اساس نسخه سرور
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # تنظیم تایم‌اوت متناسب با استعلام‌های هوش مصنوعی تصویر و ثبت احوال
        fastcgi_read_timeout 90;
        fastcgi_send_timeout 90;
        fastcgi_connect_timeout 60;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ۹. کش کردن فایل‌های استاتیک و رسانه‌ای
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}

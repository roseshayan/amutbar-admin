services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amutbar_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: production
    networks:
      - amutbar_network

  web:
    image: nginx:alpine
    container_name: amutbar_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./nginx/amutbar.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - amutbar_network

  db:
    image: mariadb:10.11
    container_name: amutbar_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: amutbar
      MYSQL_USER: amutbar_user
      MYSQL_PASSWORD: amutbar_pass
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - amutbar_network

networks:
  amutbar_network:
    driver: bridge

volumes:
  mariadb_data:
